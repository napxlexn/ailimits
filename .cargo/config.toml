# Statically link the MSVC C runtime so the exe is self-contained and runs
# on a clean Windows install without the Visual C++ Redistributable
# (otherwise: "VCRUNTIME140.dll was not found" on a fresh machine / Sandbox).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
