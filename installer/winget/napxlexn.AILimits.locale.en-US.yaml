ShortDescription: A tiny native Windows 11 overlay showing your AI provider usage limits.
Description: >-
  AI Limits is a tiny native Windows 11 floating overlay that shows your AI
  provider usage limits right on the desktop: Claude, OpenAI Codex, GitHub
  Copilot, and Google Antigravity. It only reads the tokens the official CLI
  tools already store on your machine (strictly read-only, never refreshed),
  needs no admin rights, ships statically linked with no extra runtime, and
  uses effectively no system resources when idle. A taskbar indicator keeps
  usage visible even when the overlay is hidden.
