# Release build on a v* tag push: the installer and the portable zip, each
# with an Ed25519 signature (.sig), attached to a DRAFT GitHub Release.
#
# A draft is not `releases/latest`, so nobody's auto-update sees it yet. The
# owner checks the files (VirusTotal, a quick install) and publishes it by
# hand: `gh release edit <tag> --draft=false`.
#
# Hardening: every action is pinned to a full commit SHA (the tag it was
# taken from is in the comment); no build cache is restored into a job that
# can write releases; checkout keeps no token in .git/config, so only the
# release step ever sees GITHUB_TOKEN; Inno Setup is a pinned version checked
# against its SHA-256; the signing key only reaches the signing step, and the
# job fails without it — nothing is ever published unsigned.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Inno Setup, pinned: the official installer from the jrsoftware/issrc
  # release, signed by Pyrsys B.V. Update both together, from a download
  # you have checked.
  INNO_VERSION: 6.7.4
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
  INNO_SHA256: A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C

jobs:
  build-installer:
    runs-on: windows-latest
    # The signing key is a secret of this environment (or of the repository);
    # see the notes in tools/release_sign.rs.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Before any build work: a tag without the signing key would end in an
      # unsigned release, so it ends here instead.
      - name: Require the signing key
        shell: pwsh
        env:
          AILIMITS_RELEASE_SIGNING_KEY: ${{ secrets.AILIMITS_RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:AILIMITS_RELEASE_SIGNING_KEY) {
            Write-Error "The AILIMITS_RELEASE_SIGNING_KEY secret is missing: no release is built unsigned."
            exit 1
          }

      # A tag must never ship a build that fails the project's own gate.
      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # Guard against version drift: the tag, Cargo.toml and the installer
      # script must all agree, or CI would build AiLimits-Setup-<old>.exe and
      # attach it to the <new> release (then the winget URL 404s, the About
      # version is wrong, and the signature names the wrong file).
      - name: Verify version matches the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path installer/ailimits.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "tag=$tag  Cargo.toml=$cargo  ailimits.iss=$iss"
          if ($tag -ne $cargo -or $tag -ne $iss) {
            Write-Error "Version mismatch: tag '$tag', Cargo.toml '$cargo', ailimits.iss '$iss' must all match."
            exit 1
          }

      - name: Build (release-min)
        run: cargo build --profile release-min --locked

      # A portable zip alongside the installer: what Scoop installs, and the
      # no-install option generally. The exe is statically linked, so the zip
      # is just the two binaries plus the licence texts. The self-updater
      # recognises an unmanaged copy and stands down (see updater.rs), so a
      # portable install stays whatever version its manager put there.
      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          New-Item -ItemType Directory -Force target\installer, target\portable | Out-Null
          Copy-Item target\release-min\ailimits.exe, target\release-min\ailimits-auth.exe, LICENSE, TRADEMARKS.md, README.md target\portable\
          Compress-Archive -Path target\portable\* -DestinationPath "target\installer\AiLimits-Portable-$v.zip" -Force
          Get-FileHash "target\installer\AiLimits-Portable-$v.zip" -Algorithm SHA256 | Format-List

      - name: Install Inno Setup (pinned)
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $setup -UseBasicParsing
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SHA256) {
            Write-Error "Inno Setup $env:INNO_VERSION download has SHA-256 $hash, expected $env:INNO_SHA256"
            exit 1
          }
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=`"$dir`"")
          if ($p.ExitCode -ne 0) { Write-Error "Inno Setup install failed: $($p.ExitCode)"; exit 1 }
          $iscc = Join-Path $dir "ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "no ISCC.exe in $dir"; exit 1 }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile installer
        shell: pwsh
        run: |
          & $env:ISCC "installer\ailimits.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The updater refuses an installer without a valid signature by the key
      # built into the app (src/updater.rs, RELEASE_KEYS). The tool checks
      # each signature against those very keys before writing it, so a wrong
      # secret fails here, not on users' machines.
      - name: Sign
        shell: pwsh
        env:
          AILIMITS_RELEASE_SIGNING_KEY: ${{ secrets.AILIMITS_RELEASE_SIGNING_KEY }}
        run: |
          $files = (Get-ChildItem target/installer/*.exe, target/installer/*.zip).FullName
          cargo run --locked --quiet --example release-sign -- sign @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked --quiet --example release-sign -- verify @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Surface the installer's SHA256 so the winget manifest hash can be
      # filled/verified against the exact published binary without guesswork.
      - name: Installer SHA256
        shell: pwsh
        run: |
          $exe = (Get-ChildItem target/installer/*.exe).FullName
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "Installer: $exe"
          Write-Host "SHA256:    $hash"
          "### Installer SHA256`n`n``$hash```n`nfor ``$(Split-Path $exe -Leaf)`` — paste into installer/winget/*.installer.yaml" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Release notes come from CHANGELOG.md, not from the commit log: the
      # changelog is written for users ("what changed for me"), --generate-notes
      # lists commit subjects, which are written for the next developer. Falls
      # back to generated notes when the tag has no changelog section, so a
      # release is never blocked on it.
      - name: Release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $found = $false
          if (Test-Path CHANGELOG.md) {
              $lines = Get-Content CHANGELOG.md
              $start = -1
              $end = $lines.Count
              # [regex]::Escape, not \Q..\E - PowerShell's -match is .NET regex,
              # which has no \Q quoting, so a version with dots would match loosely.
              $esc = [regex]::Escape($version)
              for ($i = 0; $i -lt $lines.Count; $i++) {
                  if ($lines[$i] -match "^##\s+$esc(\s|$)") { $start = $i + 1; continue }
                  if ($start -ge 0 -and $lines[$i] -match '^##\s') { $end = $i; break }
              }
              if ($start -ge 0) {
                  $body = ($lines[$start..($end - 1)] -join "`n").Trim()
                  if ($body) {
                      $body | Out-File -FilePath release-notes.md -Encoding utf8
                      $found = $true
                      Write-Host "Using the CHANGELOG section for $version"
                  }
              }
          }
          if (-not $found) { Write-Host "::warning::no CHANGELOG section for $version - falling back to generated notes" }
          "found=$($found.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # A draft: published by hand after VirusTotal (see the top of the file).
      - name: Create the draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = (Get-ChildItem target/installer/*.exe, target/installer/*.zip, target/installer/*.sig).FullName
          if ("${{ steps.notes.outputs.found }}" -eq "true") {
            gh release create "${{ github.ref_name }}" @assets --draft `
              --title "AI Limits ${{ github.ref_name }}" `
              --notes-file release-notes.md
          } else {
            gh release create "${{ github.ref_name }}" @assets --draft `
              --title "AI Limits ${{ github.ref_name }}" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "### Draft release created`n`nCheck the files (VirusTotal, a quick install), then publish: ``gh release edit ${{ github.ref_name }} --draft=false``" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
