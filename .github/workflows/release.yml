# Release build on a v* tag push: the installer and the portable zip, each
# with an Ed25519 signature (.sig), attached to a DRAFT GitHub Release.
#
# A draft is not `releases/latest`, so nobody's auto-update sees it yet. The
# owner checks the files (VirusTotal, a quick install) and publishes it by
# hand: `gh release edit <tag> --draft=false`.
#
# Three jobs, each on a fresh machine, each with only what it needs:
# - build: the checks, the exes, the installer and the zip. It runs every
#   dependency's build script, so it gets no secret and only a read token.
# - sign: the signing key, and nothing built by the build job's dependency
#   tree: from a clean checkout it builds the release signer
#   (tools/release-signer, ring as its one dependency), signs the files the
#   build job uploaded and checks each signature against the keys built into
#   the app. It fails without the key, so nothing is ever published unsigned.
# - publish: the draft release, with the only write token.
#
# Hardening: every action is pinned to a full commit SHA (the tag it was
# taken from is in the comment); no build cache is restored; checkout keeps
# no token in .git/config; Inno Setup is a pinned version checked against its
# SHA-256; the files pass between the jobs as artifacts whose digests the
# download checks.
name: release

on:
  push:
    tags: ["v*"]
  # By hand (Actions, "Run workflow"): the build job alone, nothing signed
  # or published, so the very files a release would carry can be checked
  # (VirusTotal, a quick install) before a tag. They are the run's
  # `release-files` artifact.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Inno Setup, pinned: the official installer from the jrsoftware/issrc
  # release, signed by Pyrsys B.V. Update both together, from a download
  # you have checked.
  INNO_VERSION: 6.7.4
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
  INNO_SHA256: A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      # A tag must never ship a build that fails the project's own gate.
      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # Guard against version drift: the tag, Cargo.toml and the installer
      # script must all agree, or CI would build AiLimits-Setup-<old>.exe and
      # attach it to the <new> release (then the winget URL 404s, the About
      # version is wrong, and the signature names the wrong file).
      - name: Verify version matches the tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path installer/ailimits.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "tag=$tag  Cargo.toml=$cargo  ailimits.iss=$iss"
          if ($tag -ne $cargo -or $tag -ne $iss) {
            Write-Error "Version mismatch: tag '$tag', Cargo.toml '$cargo', ailimits.iss '$iss' must all match."
            exit 1
          }

      # No path of the build machine in the exes: the panic locations of the
      # dependencies would otherwise carry C:\Users\runneradmin\.cargo\... (a
      # few hundred strings that machine-learning scanners count against a
      # file). The paths are rewritten to `~` and `ailimits`. Added with
      # --config, which joins them to .cargo/config.toml's rustflags: the
      # RUSTFLAGS variables would replace those, and +crt-static with them
      # (the exe would then need the Visual C++ runtime). The check after the
      # build fails the release on either.
      - name: Build (release-min)
        shell: pwsh
        run: |
          $remap = "target.x86_64-pc-windows-msvc.rustflags=['--remap-path-prefix=$env:USERPROFILE=~', '--remap-path-prefix=$env:GITHUB_WORKSPACE=ailimits']"
          cargo build --profile release-min --locked --config $remap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Self-contained, no build-machine paths
        shell: pwsh
        run: |
          $names = @($env:USERPROFILE, $env:GITHUB_WORKSPACE, 'runneradmin')
          foreach ($exe in 'target\release-min\ailimits.exe', 'target\release-min\ailimits-auth.exe') {
            $bytes = [IO.File]::ReadAllBytes($exe)
            $latin = [Text.Encoding]::Latin1.GetString($bytes)
            # The C runtime is linked in (+crt-static): no import of it.
            foreach ($dll in 'VCRUNTIME140', 'api-ms-win-crt-') {
              if ($latin.IndexOf($dll, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
                Write-Error "$exe needs $dll — the static C runtime is missing"
                exit 1
              }
            }
            foreach ($text in $latin, [Text.Encoding]::Unicode.GetString($bytes)) {
              foreach ($name in $names) {
                foreach ($form in $name, $name.Replace('\', '/'), $name.Replace('\', '\\')) {
                  if ($text.IndexOf($form, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
                    Write-Error "$exe still names $form"
                    exit 1
                  }
                }
              }
            }
          }
          Write-Host "self-contained, no build-machine paths"

      # A portable zip alongside the installer: what Scoop installs, and the
      # no-install option generally. The exe is statically linked, so the zip
      # is just the two binaries plus the licence texts (ours and the
      # crates'). The self-updater
      # recognises an unmanaged copy and stands down (see updater.rs), so a
      # portable install stays whatever version its manager put there.
      - name: Portable zip
        shell: pwsh
        run: |
          # The tag's version; by hand, Cargo.toml's.
          if ("${{ github.event_name }}" -eq "push") {
            $v = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          New-Item -ItemType Directory -Force target\installer, target\portable | Out-Null
          # The crates' licence notices name every crate in these exes.
          python tools/third_party_notices.py --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target\release-min\ailimits.exe, target\release-min\ailimits-auth.exe, LICENSE, THIRD-PARTY-NOTICES.txt, TRADEMARKS.md, README.md target\portable\
          Compress-Archive -Path target\portable\* -DestinationPath "target\installer\AiLimits-Portable-$v.zip" -Force
          Get-FileHash "target\installer\AiLimits-Portable-$v.zip" -Algorithm SHA256 | Format-List

      - name: Install Inno Setup (pinned)
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $setup -UseBasicParsing
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SHA256) {
            Write-Error "Inno Setup $env:INNO_VERSION download has SHA-256 $hash, expected $env:INNO_SHA256"
            exit 1
          }
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=`"$dir`"")
          if ($p.ExitCode -ne 0) { Write-Error "Inno Setup install failed: $($p.ExitCode)"; exit 1 }
          $iscc = Join-Path $dir "ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "no ISCC.exe in $dir"; exit 1 }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile installer
        shell: pwsh
        run: |
          & $env:ISCC "installer\ailimits.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Surface the installer's SHA256 so the winget manifest hash can be
      # filled/verified against the exact published binary without guesswork.
      - name: Installer SHA256
        shell: pwsh
        run: |
          $exe = (Get-ChildItem target/installer/*.exe).FullName
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "Installer: $exe"
          Write-Host "SHA256:    $hash"
          "### Installer SHA256`n`n``$hash```n`nfor ``$(Split-Path $exe -Leaf)`` — paste into installer/winget/*.installer.yaml" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Hand the files to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            target/installer/*.exe
            target/installer/*.zip
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    # A tag only: a run by hand stops after the build.
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    # The signing key is a secret of this environment (or of the repository);
    # see the notes in tools/release-signer/src/main.rs.
    environment: release
    steps:
      - name: Require the signing key
        shell: pwsh
        env:
          AILIMITS_RELEASE_SIGNING_KEY: ${{ secrets.AILIMITS_RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:AILIMITS_RELEASE_SIGNING_KEY) {
            Write-Error "The AILIMITS_RELEASE_SIGNING_KEY secret is missing: no release is built unsigned."
            exit 1
          }

      # Only for the signer's source: nothing of the app is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      # Built before the key is in reach: ring and its own few dependencies,
      # at the versions of the app's Cargo.lock (tools/release-signer/Cargo.lock).
      - name: Build the release signer
        run: cargo build --locked --release --manifest-path tools/release-signer/Cargo.toml

      - name: The files to sign
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      # The updater refuses an installer without a valid signature by the key
      # built into the app (src/updater/signature.rs, RELEASE_KEYS). The
      # signer checks each signature against those very keys before writing
      # it, so a wrong secret fails here, not on users' machines.
      - name: Sign
        shell: pwsh
        env:
          AILIMITS_RELEASE_SIGNING_KEY: ${{ secrets.AILIMITS_RELEASE_SIGNING_KEY }}
        run: |
          $signer = "tools\release-signer\target\release\release-signer.exe"
          $files = (Get-ChildItem release-files/*.exe, release-files/*.zip).FullName
          & $signer sign @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify
        shell: pwsh
        run: |
          $signer = "tools\release-signer\target\release\release-signer.exe"
          $files = (Get-ChildItem release-files/*.exe, release-files/*.zip).FullName
          & $signer verify @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Hand the signatures to the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signatures
          path: release-files/*.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sign
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # For CHANGELOG.md only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Their signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signatures
          path: release

      # Every file has its signature, or nothing is published.
      - name: Every file is signed
        shell: pwsh
        run: |
          $files = Get-ChildItem release/*.exe, release/*.zip
          if ($files.Count -lt 2) { Write-Error "expected the installer and the zip"; exit 1 }
          foreach ($f in $files) {
            if (-not (Test-Path "$($f.FullName).sig")) { Write-Error "$($f.Name) has no signature"; exit 1 }
          }

      # Release notes come from CHANGELOG.md, not from the commit log: the
      # changelog is written for users ("what changed for me"), --generate-notes
      # lists commit subjects, which are written for the next developer. Falls
      # back to generated notes when the tag has no changelog section, so a
      # release is never blocked on it.
      - name: Release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $found = $false
          if (Test-Path CHANGELOG.md) {
              $lines = Get-Content CHANGELOG.md
              $start = -1
              $end = $lines.Count
              # [regex]::Escape, not \Q..\E - PowerShell's -match is .NET regex,
              # which has no \Q quoting, so a version with dots would match loosely.
              $esc = [regex]::Escape($version)
              for ($i = 0; $i -lt $lines.Count; $i++) {
                  if ($lines[$i] -match "^##\s+$esc(\s|$)") { $start = $i + 1; continue }
                  if ($start -ge 0 -and $lines[$i] -match '^##\s') { $end = $i; break }
              }
              if ($start -ge 0) {
                  $body = ($lines[$start..($end - 1)] -join "`n").Trim()
                  if ($body) {
                      $body | Out-File -FilePath release-notes.md -Encoding utf8
                      $found = $true
                      Write-Host "Using the CHANGELOG section for $version"
                  }
              }
          }
          if (-not $found) { Write-Host "::warning::no CHANGELOG section for $version - falling back to generated notes" }
          "found=$($found.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # A draft: published by hand after VirusTotal (see the top of the file).
      - name: Create the draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = (Get-ChildItem release/*.exe, release/*.zip, release/*.sig).FullName
          if ("${{ steps.notes.outputs.found }}" -eq "true") {
            gh release create "${{ github.ref_name }}" @assets --draft `
              --title "AI Limits ${{ github.ref_name }}" `
              --notes-file release-notes.md
          } else {
            gh release create "${{ github.ref_name }}" @assets --draft `
              --title "AI Limits ${{ github.ref_name }}" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "### Draft release created`n`nCheck the files (VirusTotal, a quick install), then publish: ``gh release edit ${{ github.ref_name }} --draft=false``" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
