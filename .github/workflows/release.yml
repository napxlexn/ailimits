# Installer auto-build on a v* tag push — the installer is attached
# to the GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # A tag must never ship a build that fails the project's own gate.
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # Guard against version drift: the tag, Cargo.toml and the installer
      # script must all agree, or CI would build AiLimits-Setup-<old>.exe and
      # attach it to the <new> release (then the winget URL 404s and the About
      # version is wrong).
      - name: Verify version matches the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path installer/ailimits.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "tag=$tag  Cargo.toml=$cargo  ailimits.iss=$iss"
          if ($tag -ne $cargo -or $tag -ne $iss) {
            Write-Error "Version mismatch: tag '$tag', Cargo.toml '$cargo', ailimits.iss '$iss' must all match."
            exit 1
          }

      - name: Build (release-min)
        run: cargo build --profile release-min

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer\ailimits.iss"

      # Surface the installer's SHA256 so the winget manifest hash can be
      # filled/verified against the exact published binary without guesswork.
      - name: Installer SHA256
        shell: pwsh
        run: |
          $exe = (Get-ChildItem target/installer/*.exe).FullName
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "Installer: $exe"
          Write-Host "SHA256:    $hash"
          "### Installer SHA256`n`n``$hash```n`nfor ``$(Split-Path $exe -Leaf)`` — paste into installer/winget/*.installer.yaml" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Release notes come from CHANGELOG.md, not from the commit log: the
      # changelog is written for users ("what changed for me"), --generate-notes
      # lists commit subjects, which are written for the next developer. Falls
      # back to generated notes when the tag has no changelog section, so a
      # release is never blocked on it.
      - name: Release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $found = $false
          if (Test-Path CHANGELOG.md) {
              $lines = Get-Content CHANGELOG.md
              $start = -1
              $end = $lines.Count
              # [regex]::Escape, not \Q..\E - PowerShell's -match is .NET regex,
              # which has no \Q quoting, so a version with dots would match loosely.
              $esc = [regex]::Escape($version)
              for ($i = 0; $i -lt $lines.Count; $i++) {
                  if ($lines[$i] -match "^##\s+$esc(\s|$)") { $start = $i + 1; continue }
                  if ($start -ge 0 -and $lines[$i] -match '^##\s') { $end = $i; break }
              }
              if ($start -ge 0) {
                  $body = ($lines[$start..($end - 1)] -join "`n").Trim()
                  if ($body) {
                      $body | Out-File -FilePath release-notes.md -Encoding utf8
                      $found = $true
                      Write-Host "Using the CHANGELOG section for $version"
                  }
              }
          }
          if (-not $found) { Write-Host "::warning::no CHANGELOG section for $version - falling back to generated notes" }
          "found=$($found.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem target/installer/*.exe).FullName
          if ("${{ steps.notes.outputs.found }}" -eq "true") {
            gh release create "${{ github.ref_name }}" $exe `
              --title "AI Limits ${{ github.ref_name }}" `
              --notes-file release-notes.md
          } else {
            gh release create "${{ github.ref_name }}" $exe `
              --title "AI Limits ${{ github.ref_name }}" `
              --generate-notes
          }
