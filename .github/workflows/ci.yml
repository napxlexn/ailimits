# Continuous integration: the same gate the project requires on every commit
# (clippy with warnings denied + the test suite). Runs on pushes to master and
# on every pull request, so a regression is caught BEFORE a release tag is cut.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
