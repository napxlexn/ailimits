# Deploys site/ to GitHub Pages via the workflow path — no gh-pages branch,
# so the public repo keeps its single master branch.
name: pages

on:
  push:
    branches: ["master"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Actions pinned to full commit SHAs (the tag in the comment), as in
    # ci.yml and release.yml: a moved tag cannot change what deploys the site.
    # Held at the pins of the last deploys that worked (September 2026):
    # upload-pages-artifact v5 with deploy-pages v5.0.1 in one job found no
    # artifact on 2026-11-26 (three runs); try a newer pair in two jobs.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
